# Optional drop-in for larm-daemon.service.d/80-compute-cpu.conf.
# Set LARM_COMPUTE_PUBLIC_ORIGIN to the actual Control origin separately.
# Prepare the runtime and a daemon-owned 0700 state directory before enabling.
[Service]
Environment=LARM_COMPUTE_ENABLED=true
Environment=LARM_COMPUTE_RUNTIME_ROOT=/srv/ai/runtimes/larm-compute-cpu
Environment=LARM_COMPUTE_ROOT=/var/lib/larm/compute
ReadOnlyPaths=/srv/ai/runtimes/larm-compute-cpu
# bubblewrap configures loopback before the runner denies all socket syscalls.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
