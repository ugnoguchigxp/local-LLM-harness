# Source/release identities used to reconstruct binaries under /srv/ai/apps.
# No artifact from these projects is vendored into this repository.
sources:
  local-llm:
    repository: https://github.com/ugnoguchigxp/local-llm.git
    revision: d2f40a755fdda85c87274b0724a62de7250d8526
    path: /srv/ai/apps/local-llm
    package: embedding
    modelManifest: models/manifests/multilingual-e5-small-onnx-qint8.json

  llama-cpp:
    repository: https://github.com/ggml-org/llama.cpp.git
    revision: cb300598d5f90189cb69d2702f4930aaf99d32a2
    path: /srv/ai/apps/llama.cpp
    builds:
      - directory: build
        cmake:
          - -DGGML_HIP=ON
          - -DGPU_TARGETS=gfx1151
          - -DCMAKE_BUILD_TYPE=Release
      - directory: build-vulkan
        cmake:
          - -DGGML_VULKAN=ON
          - -DCMAKE_BUILD_TYPE=Release

  q38rocm:
    repository: https://github.com/julianmb/q38rocm.git
    revision: 2301c54b387a25d5b39c4381b41856a4e336c7af
    path: /srv/ai/apps/q38rocm

  llama-swap:
    repository: https://github.com/mostlygeek/llama-swap.git
    version: v251
    path: /srv/ai/apps/llama-swap

  qwen3-tts-openai-fastapi:
    repository: https://github.com/dingausmwald/Qwen3-TTS-Openai-Fastapi.git
    revision: eb14f6e6a50445cf442979abb9203ff0d5042c43
    path: /srv/ai/apps/Qwen3-TTS-Openai-Fastapi
    patch: apps/qwen-tts/rocm-gfx1151.patch

  whisper-cpp:
    repository: https://github.com/ggml-org/whisper.cpp.git
    revision: eacbd8234c6654cdbf2c377f72b2106875479bdc
    path: /srv/ai/apps/whisper.cpp
    builds:
      - directory: build-hip
        cmake:
          - -DGGML_HIP=ON
          - -DAMDGPU_TARGETS=gfx1151
          - -DCMAKE_BUILD_TYPE=Release

  reazonspeech-espnet-v2:
    repository: https://github.com/reazon-research/ReazonSpeech.git
    revision: 2d4d4762e7ee294ac8e47a177ac2e9b0e8d0d43f
    path: /srv/ai/apps/reazonspeech-espnet-v2
    package: pkg/espnet-asr
    python: "3.11"
    torch: 2.11.0+rocm7.13.0

  voicevox-core:
    repository: https://github.com/VOICEVOX/voicevox_core.git
    version: 0.17.0
    path: /srv/ai/apps/voicevox-core-0.17.0

  voicevox-vvm:
    repository: https://github.com/VOICEVOX/voicevox_vvm.git
    version: 0.16.4
    revision: c7793d12c09e3ea0a4ae41ca2bbe8b91bb17ef61
    path: /srv/ai/apps/voicevox-core-0.17.0/runtime/models/vvms/0.vvm
    required: true
    asset:
      url: https://github.com/VOICEVOX/voicevox_vvm/releases/download/0.16.4/0.vvm
      bytes: 58214379
      sha256: 917e592cae92a02fb7668bd9e168df4e39c8ab2f5302c2be71906c70ec4e2df2
      terms: https://github.com/VOICEVOX/voicevox_vvm/blob/0.16.4/README.md
      acceptance: operator-required

  voicevox-vvm-masculine:
    repository: https://github.com/VOICEVOX/voicevox_vvm.git
    version: 0.16.4
    revision: c7793d12c09e3ea0a4ae41ca2bbe8b91bb17ef61
    path: /srv/ai/apps/voicevox-core-0.17.0/runtime/models/vvms/4.vvm
    required: false
