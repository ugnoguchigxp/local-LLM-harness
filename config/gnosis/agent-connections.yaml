version: 1

audiences:
  same-host:
    network: loopback
    baseUrl: http://127.0.0.1:9810/v1
  saaa-desktop:
    network: host-private
    baseUrl: http://192.168.0.65:9810/v1

agentProfiles:
  coding-default:
    description: Resident 27B coding provider without a worker-slot swap
    providers:
      - name: llm
        capability: llm.coding
        route: llm-default
        publicModel: coding-default
        readiness: llm-inference

  coding-worker:
    description: Additional 27B coding provider with bounded 64K context on the on-demand worker slot
    providers:
      - name: llm
        capability: llm.coding
        route: llm-agent-worker
        publicModel: coding-worker
        readiness: llm-inference

  deep-reasoning-35b:
    description: On-demand 35B reasoning provider with bounded 64K context on the worker slot
    providers:
      - name: llm
        capability: llm.reasoning
        route: llm-agent-35b
        publicModel: deep-reasoning-35b
        readiness: llm-inference
