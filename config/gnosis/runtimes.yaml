runtimes:
  qwen-general:
    artifacts:
      - qwen38-primary
    capability:
      - llm.general
      - llm.reasoning
      - llm.coding
    protocol: openai.chat-completions.v1
    backend: systemd
    node: gnosis
    policy:
      class: resident
    resources:
      estimatedMemoryGB: 40
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      service: llama-server.service
      healthPort: 8080
      endpoint: http://127.0.0.1:8080

  qwen-worker-quality:
    artifacts:
      - qwen38-worker-quality
      - qwen38-mtp
    capability:
      - llm.general
      - llm.reasoning
      - llm.coding
    protocol: openai.chat-completions.v1
    backend: llama-swap
    node: gnosis
    policy:
      class: preferred
    resources:
      estimatedMemoryGB: 40
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      modelId: qwen-quality
      listen: http://127.0.0.1:8083
      endpoint: http://127.0.0.1:8083/upstream/qwen-quality
      backendEndpoint: http://127.0.0.1:8083/upstream/qwen-quality

  qwen-worker-fast:
    artifacts:
      - qwen38-worker-fast
      - qwen38-mtp
    capability:
      - llm.general
      - llm.coding
    protocol: openai.chat-completions.v1
    backend: llama-swap
    node: gnosis
    policy:
      class: preferred
    resources:
      estimatedMemoryGB: 38
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      modelId: qwen-fast
      listen: http://127.0.0.1:8083
      endpoint: http://127.0.0.1:8083/upstream/qwen-fast
      backendEndpoint: http://127.0.0.1:8083/upstream/qwen-fast

  qwen-asr:
    artifacts:
      - qwen3-asr-main
    capability:
      - speech.stt
    protocol: openai.audio-transcriptions.v1
    backend: systemd
    node: gnosis
    policy:
      class: resident
    resources:
      estimatedMemoryGB: 5
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      service: qwen-asr.service
      healthPort: 8081
      endpoint: http://127.0.0.1:8081

  voicevox-tts:
    capability:
      - speech.tts
    protocol: openai.audio-speech.v1
    backend: systemd
    node: gnosis
    policy:
      class: resident
    resources:
      estimatedMemoryGB: 1
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      service: voicevox-tts.service
      healthPort: 8084
      endpoint: http://127.0.0.1:8084

  qwen-tts:
    artifacts:
      - qwen3-tts-expressive
    capability:
      - speech.tts.expressive
    protocol: openai.audio-speech.v1
    backend: systemd
    node: gnosis
    policy:
      class: preferred
    resources:
      estimatedMemoryGB: 5
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      service: qwen-tts.service
      healthPort: 8082
      endpoint: http://127.0.0.1:8082
