runtimes:
  qwen-general:
    artifacts:
      - qwen38-primary
    capability:
      - llm.general
      - llm.reasoning
      - llm.coding
    protocol: openai.chat-completions.v1
    backend: systemd
    node: local-node
    policy:
      class: resident
    resources:
      estimatedMemoryGB: 40
      maxConcurrentRequests: 1
      maxQueuedRequests: 16
      queueTimeoutMs: 120000
    deployment:
      service: llama-server.service
      healthPort: 8080
      endpoint: http://127.0.0.1:8080

  qwen-worker-quality:
    artifacts:
      - qwen38-worker-quality
      - qwen38-mtp
    capability:
      - llm.general
      - llm.reasoning
      - llm.coding
    protocol: openai.chat-completions.v1
    backend: llama-swap
    node: local-node
