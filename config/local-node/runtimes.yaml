runtimes:
  qwen-general:
    artifacts:
      - qwen38-primary
    capability:
      - llm.general
      - llm.reasoning
      - llm.coding
    protocol: openai.chat-completions.v1
    backend: systemd
    node: local-node
    policy:
      class: resident
    context:
      class: managed-context
      activation: when-hosted
      sourceTokenLimit: 20000000
      outputReserveTokens: 32768
      safetyMarginTokens: 4096
      filesystemFreeFloorBytes: 274877906944
      operationTimeoutMs: 3300000
      allowedModes:
        - source-rebuild
    resources:
      estimatedMemoryGB: 40
      maxConcurrentRequests: 1
      maxQueuedRequests: 16
      queueTimeoutMs: 120000
    deployment:
      service: llama-server.service
      healthPort: 8080
      endpoint: http://127.0.0.1:8080

  qwen-worker-agent:
    artifacts:
      - qwen38-worker-quality
      - qwen38-mtp
    capability:
      - llm.general
      - llm.reasoning
      - llm.coding
    protocol: openai.chat-completions.v1
    backend: llama-swap
    node: local-node
    policy:
      class: preferred
      swapGroup: qwen-worker-slot
    resources:
      estimatedMemoryGB: 28
      maxConcurrentAllocations: 1
      maxConcurrentRequests: 1
      maxQueuedRequests: 16
      queueTimeoutMs: 120000
    deployment:
      modelId: qwen-agent
      listen: http://127.0.0.1:8083
      endpoint: http://127.0.0.1:8083/upstream/qwen-agent
      backendEndpoint: http://127.0.0.1:8083/upstream/qwen-agent

