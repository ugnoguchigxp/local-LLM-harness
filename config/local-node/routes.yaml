routes:
  llm-default:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    candidates:
      - runtime: qwen-general
        purpose: primary
      - runtime: qwen-worker-quality
        purpose: fallback

  llm-long-context:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-worker-quality
        purpose: primary
      - runtime: qwen-general
        purpose: fallback

  llm-agent-worker:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-worker-agent
        purpose: primary
      - runtime: qwen-general
        purpose: fallback

  llm-speed:
    capabilities:
      - llm.general
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-worker-fast
        purpose: primary
      - runtime: qwen-general
        purpose: fallback

  llm-35b:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: ornith15-35b
        purpose: primary
      - runtime: ornith15-35b-speed
        purpose: fallback
      - runtime: qwen36-35b
        purpose: fallback
      - runtime: qwen-general
        purpose: fallback

  llm-35b-speed:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: ornith15-35b-speed
        purpose: primary
      - runtime: ornith15-35b
        purpose: fallback
      - runtime: qwen-general
        purpose: fallback

  llm-agent-35b:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: ornith15-35b-agent
        purpose: primary
      - runtime: qwen-general
        purpose: fallback

  llm-qwen36-35b:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen36-35b
        purpose: primary
      - runtime: qwen-general
        purpose: fallback

  stt-default:
    capabilities:
      - speech.stt
    candidates:
      - runtime: whisper-asr
        purpose: primary
      - runtime: qwen-asr
        purpose: fallback

  stt-qwen:
    capabilities:
      - speech.stt
    explicitOnly: true
    candidates:
      - runtime: qwen-asr
        purpose: primary

  tts-default:
    capabilities:
      - speech.tts
    candidates:
      - runtime: voicevox-tts
        purpose: primary

  tts-voicevox:
    capabilities:
      - speech.tts
    explicitOnly: true
    candidates:
      - runtime: voicevox-tts
        purpose: primary

  tts-expressive:
    capabilities:
      - speech.tts.expressive
    explicitOnly: true
    candidates:
      - runtime: qwen-tts
        purpose: primary
