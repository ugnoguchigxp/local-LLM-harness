routes:
  llm-default:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    candidates:
      - runtime: qwen-worker-fast
        purpose: primary

  llm-saaa-qwen38:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-worker-fast
        purpose: primary

  llm-saaa-gemma4:
    capabilities:
      - llm.general
    explicitOnly: true
    candidates:
      - runtime: gemma4-conversation
        purpose: primary

  llm-saaa-ornith15:
    capabilities:
      - llm.general
    explicitOnly: true
    candidates:
      - runtime: ornith15-conversation
        purpose: primary

  llm-agent-worker:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-worker-fast
        purpose: primary
      - runtime: qwen-worker-agent
        purpose: fallback
      - runtime: qwen-worker-agent-efficientthink
        purpose: fallback

  # ContextStill chooses one of these explicit tiers from its final prompt
  # token count. Keeping them separate prevents a 128K request from silently
  # falling back to a 64K runtime.
  llm-contextstill-64k:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-contextstill-64k
        purpose: primary

  llm-contextstill-128k:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-worker-fast
        purpose: primary

  llm-speed:
    capabilities:
      - llm.general
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen-worker-fast
        purpose: primary

  llm-decision-default:
    capabilities:
      - llm.decision.default
    explicitOnly: true
    candidates:
      - runtime: qwen35-decision
        purpose: primary

  llm-backchannel-qwen35-2b:
    capabilities:
      - llm.backchannel.classifier
    explicitOnly: true
    candidates:
      - runtime: qwen35-decision
        purpose: primary

  llm-backchannel-default:
    capabilities:
      - llm.backchannel.classifier
    explicitOnly: true
    candidates:
      - runtime: lfm25-backchannel-jp
        purpose: primary

  llm-backchannel-lfm25-jp-1.2b:
    capabilities:
      - llm.backchannel.classifier
    explicitOnly: true
    candidates:
      - runtime: lfm25-backchannel-jp
        purpose: primary

  llm-backchannel-gemma3-1b:
    capabilities:
      - llm.backchannel.classifier
    explicitOnly: true
    candidates:
      - runtime: gemma3-backchannel
        purpose: primary

  llm-35b:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: ornith15-35b
        purpose: primary
      - runtime: ornith15-35b-speed
        purpose: fallback
      - runtime: qwen36-35b
        purpose: fallback
      - runtime: qwen-general
        purpose: fallback

  llm-35b-speed:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: ornith15-35b-speed
        purpose: primary
      - runtime: ornith15-35b
        purpose: fallback
      - runtime: qwen-general
        purpose: fallback

  llm-agent-35b:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: ornith15-35b-agent
        purpose: primary
      - runtime: qwen-general
        purpose: fallback

  llm-qwen36-35b:
    capabilities:
      - llm.general
      - llm.reasoning
      - llm.coding
    explicitOnly: true
    candidates:
      - runtime: qwen36-35b
        purpose: primary
      - runtime: qwen-general
        purpose: fallback

  stt-default:
    capabilities:
      - speech.stt
    candidates:
      - runtime: whisper-asr
        purpose: primary
      - runtime: qwen-asr
        purpose: fallback

  stt-qwen:
    capabilities:
      - speech.stt
    explicitOnly: true
    candidates:
      - runtime: qwen-asr
        purpose: primary

  tts-default:
    capabilities:
      - speech.tts
    candidates:
      - runtime: voicevox-tts
        purpose: primary

  tts-voicevox:
    capabilities:
      - speech.tts
    explicitOnly: true
    candidates:
      - runtime: voicevox-tts
        purpose: primary

  tts-expressive:
    capabilities:
      - speech.tts.expressive
    explicitOnly: true
    candidates:
      - runtime: qwen-tts
        purpose: primary

  embedding-multilingual-e5-small:
    capabilities:
      - embedding.multilingual-e5-small
    explicitOnly: true
    candidates:
      - runtime: multilingual-e5-small
        purpose: primary
