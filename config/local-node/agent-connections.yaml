version: 1
defaultAgentProfile: lfm2.5
audiences:
  same-host:
    network: loopback
    baseUrl: http://127.0.0.1:9810/v1
  saaa-desktop:
    network: host-private
    baseUrl: request-origin
agentProfiles:
  visual-perception:
    description: On-demand semantic object search and visual understanding with WeVisOne-VL-4B BF16
    schedulingPriority: 1000
    idleRelease:
      enabled: true
      idleSeconds: 60
      activityProtocols:
        - larm.visual-perception.v1
    providers:
      - name: vision
        capability: vision.perception
        route: vision-wevisone
        publicModel: wevisone-vl-4b
        readiness: visual-perception
        description: 意味による対象検索・画像説明用の補助モデル。visualPerceptionを明示してConnectionを取得しclaimする。 claimのendpointへPOST {model:"wevisone-vl-4b",image:"data:image/png;base64,...",task,query,maxNewTokens?}。 taskはreferring（関係・行動で対象を検索）、detection（queryにカテゴリ配列も可）、count_box、describe、ocr、ocr_grounding、segmentation、matting。 queryは自然文、ocrだけ空文字可。画像はPNG/JPEG/WebP静止画1枚、復号後4MiB・4194304 pixels・各辺8192px以内、EXIF正規化。 maxNewTokensは16〜512、省略256。応答はresponse（生テキスト）、detections（labelと元画像pixelのxyxy）、masks、truncated、timings（各段階のms）。 segmentationは0.5閾値の二値PNG、mattingは連続alpha PNGをmasks[].dataのbase64で返す。最大8対象・PNG合計4MiB。 countは切断なしのcount_boxで検出した箱の個数。truncated:trueでは結果が不完全。confidenceは返さない。 1536x1024の探索試験では対象検索約13秒、マスク約25秒。日本語OCRには欠落・無文字画像の誤読あり。通常のYOLO/OCRは既存の専用モデルを使う。 BF16・ROCm GPU専用、同時1要求。終了時はConnectionをreleaseする。最終解放で停止、無通信60秒でも自動解放。推論中は保持される。 workerは入力画像や結果画像を保存しない。LARM中央の推論監査方針は適用される。呼び出し期限は185秒程度を推奨。
  decision-training-background:
    description: Idle-only d1 feature extraction for asynchronous training; yields to foreground conversations
    schedulingPriority: 500
    requestScheduling: background-when-idle
    providers:
      - name: decision
        capability: decision.general
        route: general-decision-d1
        publicModel: d1-3b-general
        publishModel: false
        readiness: system-one
        description: 学習job内部の特徴抽出用。通常の即時判断はdecisionGeneralを選択する。このprofileは会話中の処理を待つ。
  decision-general-background:
    description: Explicit background general d1 decisions with optional immutable learned output heads; no conversation Provider is allocated
    schedulingPriority: 1000
    providers:
      - name: decision
        capability: decision.general
        route: general-decision-d1
        publicModel: d1-3b-general
        readiness: system-one
        description: 汎用d1判断。claimのendpointへPOST {model,state,questions,adapter?,questionSet?}。 stateはJSON objectまたはtext、画像だけならnull。questionsはid→{type,instructions,criteria?}で1〜16問。 noulはP(yes)のnoulとconfidence、choiceは名前→基準文のcriteriaに対するchoice/confidence/probabilities、 scoreは2〜10段階の基準文配列に対する期待値score/confidence/probabilities/legend（0始まり）。 応答は{model,adapter:null|{id,version},answers,usage,routing}。 stateはUTF-8 JSONで50000 bytes、stateと全質問・画像を含む入力4096 tokens、要求全体2MiB。 imagesはPNG/JPEG/WebPのbase64 data URLを1枚まで、復号後1MiB・1048576 pixels、内部で最大辺384pxへ縮小。 adapter:{id,version}とquestionSet:{id,version}で学習済みheadを選択、省略時は基本モデル。質問定義も照合する。 学習例はControl BearerでPOST /v1/decision/datasetsへJSONL（8MiB・2000行まで、train/eval必須、課題単位分割）。 POST /v1/decision/training-jobs {model,datasetId,questionSet:{id,version,questions}}は202/jobIdを返し、GET /v1/decision/training-jobs/{jobId}で進捗・adapter・eval指標を取得。 データはGET/DELETE /v1/decision/datasets/{id}、adapterはGET /v1/decision/adapters、GET/DELETE /v1/decision/adapters/{id}/versions/{version}。 変更APIはIdempotency-Key必須。学習state/ラベルを推論時にロードせず、headのみCPUメモリ常駐。 未登録/削除済みはdecision_adapter_not_found、質問セット不一致はdecision_adapter_mismatch。 低遅延の継続利用はConnectionを保持してrenewする。最終解放後は120秒でidle停止。学習特徴抽出は会話のidle時に進め、会話中はwaiting_for_idleとなる。
