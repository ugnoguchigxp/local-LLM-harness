  SAAA-w-Image:
    agentProfile: saaa-conversation-gemma4-26b-voice
    services:
      - name: mesh
        capability: media.mesh.generate
        protocol: larm.mesh-generation.v1
        endpoint: /v1/3d/generations
        model: trellis2-4b
        startupPolicy:
          minWarmInstances: 0
          idleTtlSeconds: 0
        description: TRELLIS.2による3D生成は512固定、12 steps固定（要求にstepsフィールドは送らない）、GLB出力。sourceは既存のimage-artifact ID、またはpromptを指定。画像はPNG/WebP、20 MiB以内、最大4096px。3D要求に任意URL・ホストパス・直接uploadは受け付けない。端末画像はPOST /v1/image-artifacts/importsで画像IDを取得して指定する（Control認証、multipartのfile 1個、UUIDキー、JPEG/PNG/WebP静止画16 MiB・各辺2000pxまで。WebP圧縮payloadは再圧縮せず保存）。prompt入力のsource.imageModelは同じcatalogのmedia.image.generateサービスのmodelを使用する（元画像は768角・8 steps・PNG）。Control BearerとIdempotency-Key UUIDが必要。Agent Connection取得・Profile切替は不要。HTTP 202でjobを返し、statusUrlまたはeventsUrlを追跡する。既定seedは42。ライブラリは/v1/3d/assets。生成完了後にworkerを停止。WebP対応viewerまたはBlender 4.0以降で表示する。
      - name: image
        capability: media.image.generate
        protocol: larm.image-generation.v1
        endpoint: /v1/images/generations
        model: qwen-image-2.1-turbo
        description: Qwen-Image 2.1 Turbo AD-Q4_Kによる画像生成。POSTでpromptを指定すると起動し、画像保存後に停止します。width/heightは縦横それぞれ100〜1280の整数を自由指定できます（省略時512）。内部では各辺を32の倍数へ切り上げて生成し、指定どおりの寸法へ縮小して返します。stepsは8固定、seedは任意、formatはwebpまたはpng（省略時webp）。このPCで起動から応答まで512角約16秒・768角約31秒・1024角約58秒、中間サイズの個別生成試験では1216角約87秒・1280角約97秒でした。応答のartifacts[0].contentUrlをControlのURLに解決してGETすると画像を取得できます。写真・イラスト・構図検討に対応。参照画像による編集はこのAPIでは未対応。
        startupPolicy:
          minWarmInstances: 0
          idleTtlSeconds: 0
  SAAA-w-music:
    agentProfile: saaa-conversation-gemma4-26b-voice
    services:
      - name: mesh
        capability: media.mesh.generate
        protocol: larm.mesh-generation.v1
        endpoint: /v1/3d/generations
        model: trellis2-4b
        startupPolicy:
          minWarmInstances: 0
          idleTtlSeconds: 0
        description: TRELLIS.2による3D生成は512固定、12 steps固定（要求にstepsフィールドは送らない）、GLB出力。sourceは既存のimage-artifact ID、またはpromptを指定。画像はPNG/WebP、20 MiB以内、最大4096px。3D要求に任意URL・ホストパス・直接uploadは受け付けない。端末画像はPOST /v1/image-artifacts/importsで画像IDを取得して指定する（Control認証、multipartのfile 1個、UUIDキー、JPEG/PNG/WebP静止画16 MiB・各辺2000pxまで。WebP圧縮payloadは再圧縮せず保存）。prompt入力のsource.imageModelは同じcatalogのmedia.image.generateサービスのmodelを使用する（元画像は768角・8 steps・PNG）。Control BearerとIdempotency-Key UUIDが必要。Agent Connection取得・Profile切替は不要。HTTP 202でjobを返し、statusUrlまたはeventsUrlを追跡する。既定seedは42。ライブラリは/v1/3d/assets。生成完了後にworkerを停止。WebP対応viewerまたはBlender 4.0以降で表示する。
      - name: music
        capability: media.music.generate
        protocol: larm.music-generation.v1
        endpoint: /v1/music/generations
        model: auto
        description: 要求に応じた音声生成。instrumental:trueはStable Audio 3 Small Music、instrumental:false（既存互換の既定）はACE-Step 1.5 Turbo Normalでボーカル生成。歌詞はlyricsに指定します。効果音はtask:"sound-effect"またはmodel:"stable-audio-3-small-sfx"でStable Audio 3 Small SFXを使います。XLは使用しません。既存のmodel:"ace-step-1.5"と"acestep-v15-turbo"も自動選択の互換名です。POSTでprompt（曲調・編成）を指定すると起動し、音声保存後に停止します。durationSecondsはStable Music・SFXでは1〜120秒、ACE-Stepでは1〜600秒で小数も指定できます。省略時は歌なし120秒、効果音5秒、ボーカル180秒です。Stable Musicのモデルだけを明示した場合は歌なしを既定とします。明示された長さを自動短縮しません。GET /v1/music/providersのmodelsで用途別の既定値と上限を確認できます。qualityはfast（4ステップ・高速試作）、balanced（8ステップ・標準、省略時）、high（12ステップ）から選択。試作例：{"prompt":"軽快なピアノのBGM","durationSeconds":30,"quality":"fast","instrumental":true}。instrumentalは歌なし指定（省略時false）で、trueの場合はlyricsを指定しません。歌詞はlyrics、seedは任意、outputFormatはopus・mp3・wav・flac（省略時opus、128 kbps VBR・48 kHz）。OpusはACE-Stepの一時WAV32またはStable Audioのメモリ上のWAV16から変換します。ACE-Stepの中間ファイルは変換直後に削除し、Stable Audioは中間ファイルを作りません。Stable Audioのbpm・key・timeSignatureはプロンプトへのヒントで、厳密な制御ではありません。providerOptionsはStable Audioではguidance_scale（0〜10）のみ指定できます。title（曲名）とtags（タグ一覧）は任意。説明からテンポ・雰囲気・ジャンル・楽器のタグを自動生成します。GET /v1/music/tagsでタグと曲数を取得し、GET /v1/music/tracks?tags=アップテンポ,明るいで複数タグに絞れます。sort=createdAt&order=ascで古い順（既定は新しい順）、q=検索語&sort=relevanceで一致度順を指定できます。楽曲・お気に入り・タグ一覧はすべて既定50件（limitは1〜100）。nextCursorをcursorに渡すと続き、totalは全件数です。ページ継続時は同じAPIで検索・タグ・並び順を維持し、生成・削除後のタグ一覧は先頭から再取得してください。完成曲は既定で期限なしに保存し、GET /v1/music/tracks?q=検索語で曲名・prompt・歌詞・タグを検索できます（limitは1〜100、nextCursorをcursorに渡すと続き）。GET /v1/music/tracks/{id}/audioで再生、GET /v1/music/favoritesでお気に入り一覧、PUTまたはDELETE /v1/music/generations/{id}/favoriteで登録・解除、DELETE /v1/music/tracks/{id}で楽曲を削除できます。容量上限では自動削除せずmusic_storage_fullで保存を拒否します。HTTP 202で返るjobIdを使いGET /v1/music/generations/{jobId}で状態を確認し、statusがcompletedになったらresult.audioUrlをControlのURLに解決してGETすると音声を取得できます。短い曲とfast設定で試作し、必要な長さとbalanced設定で本番生成できます。起動時間が加わり、highで音質向上を保証するものではありません。参照音源による編集は未対応。
        startupPolicy:
          minWarmInstances: 0
          idleTtlSeconds: 0
