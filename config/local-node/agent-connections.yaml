version: 1
defaultAgentProfile: coding-default

audiences:
  same-host:
    network: loopback
    baseUrl: http://127.0.0.1:9810/v1
  saaa-desktop:
    network: host-private
    baseUrl: request-origin

agentProfiles:
  coding-default:
    description: Standard Qwen 3.8 27B Q4_0 225K worker with MTP
    schedulingPriority: 3000
    providers:
      - name: llm
        capability: llm.coding
        route: llm-default
        publicModel: coding-default
        readiness: llm-inference
        contextWindow:
          maxTokens: 230400
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  saaa-conversation-gemma4:
    description: SAAA warm conversation preset with Gemma 4 E4B, Qwen ASR, VOICEVOX TTS, and multilingual E5 embedding
    schedulingPriority: 3000
    providers:
      - name: llm
        capability: llm.general
        route: llm-saaa-gemma4
        publicModel: gemma4-e4b
        readiness: llm-inference
        contextWindow:
          maxTokens: 230400
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
      - name: asr
        capability: speech.stt
        route: stt-qwen
        publicModel: qwen3-asr-1.7b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
  saaa-conversation-ornith15:
    description: Explicit SAAA conversation candidate with Ornith 1.5 35B, Qwen ASR, VOICEVOX TTS, and multilingual E5 embedding
    schedulingPriority: 3000
    providers:
      - name: llm
        capability: llm.general
        route: llm-saaa-ornith15
        publicModel: ornith-1.5-35b-conversation
        readiness: llm-inference
        contextWindow:
          maxTokens: 230400
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
      - name: asr
        capability: speech.stt
        route: stt-qwen
        publicModel: qwen3-asr-1.7b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
  saaa-qwen38:
    description: Compatibility profile ID for the SAAA Gemma 4 warm conversation preset
    schedulingPriority: 3000
    providers:
      - name: llm
        capability: llm.general
        route: llm-saaa-gemma4
        publicModel: gemma4-e4b
        readiness: llm-inference
        contextWindow:
          maxTokens: 230400
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
      - name: asr
        capability: speech.stt
        route: stt-qwen
        publicModel: qwen3-asr-1.7b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
  contextstill-background:
    description: ContextStill background Qwen 3.8 27B provider
    schedulingPriority: 1000
    providers:
      - name: llm
        capability: llm.coding
        route: llm-agent-worker
        publicModel: qwen-agent-worker
        readiness: llm-inference
  contextstill-background-64k:
    description: Explicit ContextStill background tier for requests that fit the 64K budget
    schedulingPriority: 1000
    providers:
      - name: llm
        capability: llm.coding
        route: llm-contextstill-64k
        publicModel: qwen-contextstill-64k
        readiness: llm-inference
        contextWindow:
          maxTokens: 65536
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  contextstill-background-128k:
    description: Explicit ContextStill background tier for requests that exceed the 64K budget
    schedulingPriority: 1000
    providers:
      - name: llm
        capability: llm.coding
        route: llm-contextstill-128k
        publicModel: qwen-contextstill-128k
        readiness: llm-inference
        contextWindow:
          maxTokens: 131072
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  contextstill-decision-default-canary:
    description: Explicit Qwen 3.5 2B ContextStill decision Provider canary
    schedulingPriority: 1000
    providers:
      - name: decision-default
        capability: llm.decision.default
        route: llm-decision-default
        publicModel: decision-default
        readiness: llm-inference
  contextstill-backchannel-qwen35-2b:
    description: Explicit Qwen 3.5 2B backchannel classifier candidate
    schedulingPriority: 1000
    providers:
      - name: backchannel
        capability: llm.backchannel.classifier
        route: llm-backchannel-qwen35-2b
        publicModel: backchannel-qwen35-2b
        readiness: llm-inference
  contextstill-backchannel-lfm25-jp-1.2b:
    description: Explicit Japanese-tuned LFM 2.5 1.2B backchannel classifier candidate
    schedulingPriority: 1000
    providers:
      - name: backchannel
        capability: llm.backchannel.classifier
        route: llm-backchannel-lfm25-jp-1.2b
        publicModel: backchannel-lfm25-jp-1.2b
        readiness: llm-inference
  contextstill-backchannel-gemma3-1b:
    description: Explicit Gemma 3 1B multilingual backchannel classifier candidate
    schedulingPriority: 1000
    providers:
      - name: backchannel
        capability: llm.backchannel.classifier
        route: llm-backchannel-gemma3-1b
        publicModel: backchannel-gemma3-1b
        readiness: llm-inference
  saaa-backchannel-default:
    description: SAAA default backchannel classifier using Japanese-tuned LFM 2.5 1.2B
    schedulingPriority: 3000
    providers:
      - name: backchannel
        capability: llm.backchannel.classifier
        route: llm-backchannel-default
        publicModel: backchannel-default
        readiness: llm-inference
  nightworker-background:
    description: NightWorker background Qwen 3.8 27B provider
    schedulingPriority: 2000
    providers:
      - name: llm
        capability: llm.coding
        route: llm-agent-worker
        publicModel: qwen-nightworker
        readiness: llm-inference
  asr-qwen:
    description: Resident Qwen3 ASR OpenAI-compatible provider
    providers:
      - name: asr
        capability: speech.stt
        route: stt-qwen
        publicModel: qwen3-asr-1.7b
        readiness: stt-transcription
  tts-default:
    description: Resident VOICEVOX OpenAI-compatible speech provider
    providers:
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        readiness: tts-speech
  tts-expressive:
    description: Explicit Qwen3 expressive speech provider
    providers:
      - name: tts
        capability: speech.tts.expressive
        route: tts-expressive
        publicModel: qwen3-tts-expressive
        readiness: tts-speech
  contextstill-embedding:
    description: Dynamic multilingual E5 query and passage embedding provider
    schedulingPriority: 1500
    providers:
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        readiness: embedding

compatibilityAliases:
  deep-reasoning-35b:
    canonicalProfile: coding-default
    description: Deprecated SAAA bootstrap alias routed to the resident 27B Qwen provider
    providerCapabilities:
      llm: llm.reasoning
