version: 1
defaultAgentProfile: coding-default

audiences:
  same-host:
    network: loopback
    baseUrl: http://127.0.0.1:9810/v1
  saaa-desktop:
    network: host-private
    baseUrl: request-origin

agentProfiles:
  coding-default:
    description: Resident Ornith 1.5 35B ROCmFP4 128K provider with MTP
    schedulingPriority: 3000
    providers:
      - name: llm
        capability: llm.coding
        route: llm-default
        publicModel: coding-default
        readiness: llm-inference
        contextWindow:
          maxTokens: 131072
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  saaa-conversation-gemma4:
    description: SAAA warm conversation preset with Gemma 4 E4B, Qwen ASR, VOICEVOX TTS, and multilingual E5 embedding
    schedulingPriority: 4000
    idleRelease: &saaa-idle-release
      enabled: true
      idleSeconds: 300
      activityProtocols:
        - openai.audio-speech.v1
        - openai.audio-transcriptions.v1
        - openai.chat-completions.v1
    providers:
      - name: llm
        capability: llm.general
        route: llm-saaa-gemma4
        publicModel: gemma4-e4b
        readiness: llm-inference
        contextWindow:
          maxTokens: 230400
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
      - name: asr
        capability: speech.stt
        route: stt-qwen
        publicModel: qwen3-asr-1.7b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
  saaa-conversation-gemma4-26b-voice:
    description: SAAA Gemma 4 26B-A4B profile with warm LLM, ASR, TTS, embedding, and Ruri speaking-attitude System One
    schedulingPriority: 4000
    idleRelease:
      enabled: true
      idleSeconds: 300
      activityProtocols:
        - larm.system-one.v1
        - openai.audio-speech.v1
        - openai.audio-transcriptions.v1
        - openai.chat-completions.v1
    providers:
      - name: llm
        capability: llm.general
        route: llm-saaa-gemma4-26b
        publicModel: gemma4-26b-a4b
        readiness: llm-inference
        contextWindow:
          maxTokens: 262144
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
      - name: asr
        capability: speech.stt
        route: stt-qwen
        publicModel: qwen3-asr-1.7b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
      - name: system-one
        capability: decision.system-one
        route: system-one-ruri
        publicModel: ruri-v3-30m-speaking-attitude
        publishModel: false
        readiness: system-one
  saaa-conversation-gemma4-26b-64k:
    description: SAAA auxiliary 64K LLM session sharing the Gemma 4 26B four-slot runtime with the main voice profile
    schedulingPriority: 4000
    idleRelease:
      enabled: true
      idleSeconds: 300
      activityProtocols:
        - openai.chat-completions.v1
    providers:
      - name: llm
        capability: llm.general
        route: llm-saaa-gemma4-26b
        publicModel: gemma4-26b-a4b
        publishModel: false
        readiness: llm-inference
        contextWindow:
          maxTokens: 65536
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  saaa-conversation-ornith15:
