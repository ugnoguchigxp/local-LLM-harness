    idleRelease:
      enabled: true
      idleSeconds: 300
      activityProtocols:
        - larm.system-one.v1
        - openai.audio-speech.v1
        - openai.audio-transcriptions.v1
        - openai.chat-completions.v1
    providers:
      - name: llm
        capability: llm.general
        route: llm-ornith15-strix
        publicModel: ornith-1.5-strix-lean
        readiness: llm-inference
        contextWindow:
          maxTokens: 262144
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
      - name: asr
        capability: speech.stt
        route: stt-granite
        publicModel: granite-speech-4.1-2b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
      - name: tts-english
        capability: speech.tts.english
        route: tts-kittentts-nano
        publicModel: kitten-tts-nano-0.8-fp32
        publishModel: false
        readiness: tts-speech
      - name: system-one
        capability: decision.system-one
        route: system-one-ruri
        publicModel: ruri-v3-30m-speaking-attitude
        publishModel: false
        readiness: system-one
  ornith1.5Strix-game:
    description: Ornith STRIX_LEAN voice profile with an explicitly selected d1-3B game decision Provider
    schedulingPriority: 4000
    requestScheduling: foreground-exclusive
    usageProtection: { idleSeconds: 600, retention: until-next-profile }
    idleRelease:
      enabled: true
      idleSeconds: 300
      activityProtocols:
        - larm.system-one.v1
        - openai.audio-speech.v1
        - openai.audio-transcriptions.v1
        - openai.chat-completions.v1
    providers:
      - name: llm
        capability: llm.general
        route: llm-ornith15-strix
        publicModel: ornith-1.5-strix-lean
        readiness: llm-inference
        contextWindow:
          maxTokens: 262144
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
      - name: asr
        capability: speech.stt
        route: stt-granite
        publicModel: granite-speech-4.1-2b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
      - name: tts-english
        capability: speech.tts.english
        route: tts-kittentts-nano
        publicModel: kitten-tts-nano-0.8-fp32
        publishModel: false
        readiness: tts-speech
      - name: system-one
        capability: decision.system-one
        route: system-one-ruri
        publicModel: ruri-v3-30m-speaking-attitude
        publishModel: false
        readiness: system-one
      - name: game-decision
        capability: decision.game
        route: game-decision-d1
        publicModel: d1-3b-game
        publishModel: false
        readiness: system-one
  saaa-conversation-gemma4-26b-64k:
    description: SAAA auxiliary 64K LLM session sharing the Gemma 4 26B four-slot runtime with the main voice profile
    schedulingPriority: 4000
    requestScheduling: foreground-exclusive
    usageProtection: { idleSeconds: 600, retention: until-next-profile }
    idleRelease:
      enabled: true
      idleSeconds: 300
      activityProtocols:
        - openai.chat-completions.v1
    providers:
      - name: llm
        capability: llm.general
        route: llm-saaa-gemma4-26b
        publicModel: gemma4-26b-a4b
        publishModel: false
        readiness: llm-inference
        contextWindow:
          maxTokens: 65536
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  contextstill-background:
    description: ContextStill background profile sharing the warm Ornith STRIX_LEAN vision LLM, Laya System One, and multilingual E5 embedding
    schedulingPriority: 1000
    requestScheduling: background-when-idle
    providers:
      - name: llm
        capability: llm.coding
        route: llm-contextstill-ornith
        publicModel: ornith-contextstill
        readiness: llm-inference
        contextWindow:
          maxTokens: 32768
          outputReserveTokens: 4096
          safetyMarginTokens: 0
      - name: asr
        capability: speech.stt
        route: stt-granite
        publicModel: granite-speech-4.1-2b
        publishModel: false
        readiness: stt-transcription
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        publishModel: false
        readiness: tts-speech
      - name: tts-english
        capability: speech.tts.english
        route: tts-kittentts-nano
        publicModel: kitten-tts-nano-0.8-fp32
        publishModel: false
        readiness: tts-speech
      - name: system-one
        capability: decision.system-one
        route: system-one-laya
        publicModel: laya-multilingual
        publishModel: false
        readiness: system-one
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        publishModel: false
        readiness: embedding
  contextstill-background-64k:
    description: Explicit ContextStill background tier for requests that fit the 64K budget
    schedulingPriority: 1000
    requestScheduling: background-when-idle
    providers:
      - name: llm
        capability: llm.coding
        route: llm-contextstill-64k
        publicModel: qwen-contextstill-64k
        readiness: llm-inference
        contextWindow:
          maxTokens: 65536
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  contextstill-background-128k:
    description: Explicit ContextStill background tier for requests that exceed the 64K budget
    schedulingPriority: 1000
    requestScheduling: background-when-idle
    providers:
      - name: llm
        capability: llm.coding
        route: llm-contextstill-128k
        publicModel: qwen-contextstill-128k
        readiness: llm-inference
        contextWindow:
          maxTokens: 131072
          outputReserveTokens: 4096
          safetyMarginTokens: 1976
  contextstill-backchannel-qwen35-2b:
    description: Explicit Qwen 3.5 2B backchannel classifier candidate
    schedulingPriority: 1000
    providers:
      - name: backchannel
        capability: llm.backchannel.classifier
        route: llm-backchannel-qwen35-2b
        publicModel: backchannel-qwen35-2b
        readiness: llm-inference
  saaa-backchannel-default:
    description: SAAA default backchannel and lightweight decision provider using Qwen 3.5 2B
    schedulingPriority: 4000
    providers:
      - name: backchannel
        capability: llm.backchannel.classifier
        route: llm-backchannel-default
        publicModel: backchannel-default
        readiness: llm-inference
  nightworker-background:
    description: NightWorker background Qwen 3.8 27B provider
    schedulingPriority: 2000
    providers:
      - name: llm
        capability: llm.coding
        route: llm-agent-worker
        publicModel: qwen-nightworker
        readiness: llm-inference
  asr-qwen:
    description: On-demand Qwen3 ASR OpenAI-compatible provider
    providers:
      - name: asr
        capability: speech.stt
        route: stt-qwen
        publicModel: qwen3-asr-1.7b
        readiness: stt-transcription
  tts-default:
    description: Resident VOICEVOX OpenAI-compatible speech provider
    providers:
      - name: tts
        capability: speech.tts
        route: tts-voicevox
        publicModel: voicevox-core
        readiness: tts-speech
  tts-english:
    description: Resident CPU English KittenTTS Nano FP32 provider with Rosie and Hugo voices
    providers:
      - name: tts-english
        capability: speech.tts.english
        route: tts-kittentts-nano
        publicModel: kitten-tts-nano-0.8-fp32
        readiness: tts-speech
  tts-expressive:
    description: Explicit Qwen3 expressive speech provider
    providers:
      - name: tts
        capability: speech.tts.expressive
        route: tts-expressive
        publicModel: qwen3-tts-expressive
        readiness: tts-speech
  contextstill-embedding:
    description: Dynamic multilingual E5 query and passage embedding provider
    schedulingPriority: 1500
    providers:
      - name: embedding
        capability: embedding.multilingual-e5-small
        route: embedding-multilingual-e5-small
        publicModel: multilingual-e5-small
        readiness: embedding
  asr-granite:
    description: Granite Speech 4.1 2B Q8 Vulkan provider for Japanese and English short voice dialogue
    providers:
      - name: asr
        capability: speech.stt
        route: stt-granite
        publicModel: granite-speech-4.1-2b
        readiness: stt-transcription

profileSelectors:
  contextStill:
    agentProfile: contextstill-background
  SAAA-gemma4-26b:
    agentProfile: saaa-conversation-gemma4-26b-voice
  SAAA-gemma4-26b-64k:
    agentProfile: saaa-conversation-gemma4-26b-64k
  ornith1.5Strix:
    agentProfile: ornith1.5Strix
  ornith1.5Strix-game:
    agentProfile: ornith1.5Strix-game
  SAAA-w-Image:
    agentProfile: saaa-conversation-gemma4-26b-voice
    services:
      - name: mesh
        capability: media.mesh.generate
        protocol: larm.mesh-generation.v1
        endpoint: /v1/3d/generations
        model: trellis2-4b
        startupPolicy: { minWarmInstances: 0, idleTtlSeconds: 0 }
        description: 'TRELLIS.2による3D生成は512固定、12 steps固定（要求にstepsフィールドは送らない）、GLB出力。sourceは既存のimage-artifact ID、またはpromptを指定。画像はPNG/WebP、20 MiB以内、最大4096px。任意URL・ホストパス・直接uploadは受け付けない。prompt入力のsource.imageModelは同じcatalogのmedia.image.generateサービスのmodelを使用する（元画像は768角・8 steps・PNG）。Control BearerとIdempotency-Key UUIDが必要。Agent Connection取得・Profile切替は不要。HTTP 202でjobを返し、statusUrlまたはeventsUrlを追跡する。既定seedは42。ライブラリは/v1/3d/assets。生成完了後にworkerを停止。WebP対応viewerまたはBlender 4.0以降で表示する。'
      - name: image
        capability: media.image.generate
        protocol: larm.image-generation.v1
        endpoint: /v1/images/generations
        model: qwen-image-2.1-turbo
        description: 'Qwen-Image 2.1 Turbo AD-Q4_Kによる画像生成。POSTでpromptを指定すると起動し、画像保存後に停止します。width/heightは縦横それぞれ100〜1280の整数を自由指定できます（省略時512）。内部では各辺を32の倍数へ切り上げて生成し、指定どおりの寸法へ縮小して返します。stepsは8固定、seedは任意、formatはwebpまたはpng（省略時webp）。このPCで起動から応答まで512角約16秒・768角約31秒・1024角約58秒、中間サイズの個別生成試験では1216角約87秒・1280角約97秒でした。応答のartifacts[0].contentUrlをControlのURLに解決してGETすると画像を取得できます。写真・イラスト・構図検討に対応。参照画像による編集はこのAPIでは未対応。'
        startupPolicy: { minWarmInstances: 0, idleTtlSeconds: 0 }
  SAAA-w-music:
    agentProfile: saaa-conversation-gemma4-26b-voice
    services:
      - name: mesh
        capability: media.mesh.generate
        protocol: larm.mesh-generation.v1
        endpoint: /v1/3d/generations
        model: trellis2-4b
        startupPolicy: { minWarmInstances: 0, idleTtlSeconds: 0 }
        description: 'TRELLIS.2による3D生成は512固定、12 steps固定（要求にstepsフィールドは送らない）、GLB出力。sourceは既存のimage-artifact ID、またはpromptを指定。画像はPNG/WebP、20 MiB以内、最大4096px。任意URL・ホストパス・直接uploadは受け付けない。prompt入力のsource.imageModelは同じcatalogのmedia.image.generateサービスのmodelを使用する（元画像は768角・8 steps・PNG）。Control BearerとIdempotency-Key UUIDが必要。Agent Connection取得・Profile切替は不要。HTTP 202でjobを返し、statusUrlまたはeventsUrlを追跡する。既定seedは42。ライブラリは/v1/3d/assets。生成完了後にworkerを停止。WebP対応viewerまたはBlender 4.0以降で表示する。'
      - name: music
        capability: media.music.generate
        protocol: larm.music-generation.v1
        endpoint: /v1/music/generations
        model: ace-step-1.5
        description: 'ACE-Step 1.5 Turboによる楽曲生成。POSTでprompt（曲調・編成）を指定すると起動し、音声保存後に停止します。durationSecondsは曲の長さを1〜600秒で指定（省略時180秒）。qualityはfast（4ステップ・高速試作）、balanced（8ステップ・標準、省略時）、high（12ステップ）から選択。試作例：{"prompt":"軽快なピアノのBGM","durationSeconds":30,"quality":"fast","instrumental":true}。instrumentalは歌なし指定（省略時false）で、trueの場合はlyricsを指定しません。歌詞はlyrics、seedは任意、outputFormatはopus・mp3・wav・flac（省略時opus、128 kbps VBR・48 kHz）。Opusは一時的な32 bit浮動小数点WAVから変換し、中間音声は変換直後に削除します。title（曲名）とtags（タグ一覧）は任意。説明からテンポ・雰囲気・ジャンル・楽器のタグを自動生成します。GET /v1/music/tagsでタグと曲数を取得し、GET /v1/music/tracks?tags=アップテンポ,明るいで複数タグに絞れます。sort=createdAt&order=ascで古い順（既定は新しい順）、q=検索語&sort=relevanceで一致度順を指定できます。楽曲・お気に入り・タグ一覧はすべて既定50件（limitは1〜100）。nextCursorをcursorに渡すと続き、totalは全件数です。ページ継続時は同じAPIで検索・タグ・並び順を維持し、生成・削除後のタグ一覧は先頭から再取得してください。完成曲は既定で期限なしに保存し、GET /v1/music/tracks?q=検索語で曲名・prompt・歌詞・タグを検索できます（limitは1〜100、nextCursorをcursorに渡すと続き）。GET /v1/music/tracks/{id}/audioで再生、GET /v1/music/favoritesでお気に入り一覧、PUTまたはDELETE /v1/music/generations/{id}/favoriteで登録・解除、DELETE /v1/music/tracks/{id}で楽曲を削除できます。容量上限では自動削除せずmusic_storage_fullで保存を拒否します。HTTP 202で返るjobIdを使いGET /v1/music/generations/{jobId}で状態を確認し、statusがcompletedになったらresult.audioUrlをControlのURLに解決してGETすると音声を取得できます。短い曲とfast設定で試作し、必要な長さとbalanced設定で本番生成できます。起動時間が加わり、highで音質向上を保証するものではありません。参照音源による編集は未対応。'
        startupPolicy: { minWarmInstances: 0, idleTtlSeconds: 0 }
  embeddingCanary:
    agentProfile: contextstill-embedding
  backchannelQwen35:
    agentProfile: contextstill-backchannel-qwen35-2b

compatibilityAliases: {}
