    ttl: 0
    filters:
      setParams:
        temperature: 0
        top_p: 1
        max_tokens: 16
        response_format:
          type: json_schema
          json_schema:
            name: backchannel_decision
            strict: true
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - ack
                    - defer
              required:
