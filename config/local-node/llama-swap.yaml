# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# Optional worker pool. Agent connection profiles use bounded 64K workers that can coexist with the
# resident ROCmFP4 provider on :8080.

healthCheckTimeout: 300
logLevel: info
logToStdout: proxy
startPort: 58000
globalTTL: 300
unloadTimeout: 30

models:
  lfm3-conversation:
    ttl: 0
    cmd: >
      /usr/bin/python3
      /srv/ai/apps/larm-lfm-retention-d05706b-v1/launch-prompt-retention.py
      /etc/larm/prompt-retention.env.json
      /srv/ai/apps/larm-lfm-retention-d05706b-v1/llama-server
      -m /srv/ai/models/lfm3-1.7b-gguf/LFM3-1.7B-QAD-Q4_0.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --load-mode none
      --flash-attn on
      --ctx-size 131072
      --parallel 4
      --batch-size 2048
      --ubatch-size 512
      --threads 16
      --cache-type-k q4_0
      --cache-type-v q4_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning on
      --reasoning-format deepseek
      --reasoning-budget -1
      --temp 0.1
      --top-k 50
      --top-p 1
      --min-p 0
      --repeat-penalty 1.1
      --jinja
      --no-context-shift
      --cache-prompt
      --cache-reuse 0
      --no-kv-unified
      --ctx-checkpoints 8
      --checkpoint-min-step 1024
      --cache-ram 8192
      --no-cache-idle-slots
      --metrics
      --no-webui
    aliases:
      - lfm3-1.7b
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

