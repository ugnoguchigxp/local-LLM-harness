# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# Optional worker pool. Agent connection profiles use bounded 64K workers that can coexist with the
# resident ROCmFP4 provider on :8080.

healthCheckTimeout: 300
logLevel: info
logToStdout: proxy
startPort: 58000
globalTTL: 300
unloadTimeout: 30

models:
  qwen-agent:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/qwen38-worker/Qwen3.8-27B-UD-Q4_K_XL.gguf
      -md /srv/ai/models/qwen38-worker/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -dev Vulkan0
      -devd Vulkan0
      -ngl 999
      -ngld 999
      --fit off
      --flash-attn on
      --ctx-size 65536
      --parallel 1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q4_0
      --spec-draft-type-v q4_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.2
      --top-p 0.9
      --jinja
      --context-shift
      --cache-reuse 256
      --metrics
      --no-webui
    aliases:
      - qwen3.8-agent
      - qwen-agent-worker
      - qwen-nightworker
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  qwen-agent-efficientthink:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/qwen38-efficientthink/Qwen3.8-27B-EfficientThink-SimPO-Q3-LynnStyle.gguf
      -md /srv/ai/models/qwen38-efficientthink/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -dev Vulkan0
      -devd Vulkan0
      -ngl 999
      -ngld 999
      --fit off
      --flash-attn on
      --ctx-size 65536
      --parallel 1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q4_0
      --spec-draft-type-v q4_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.2
      --top-p 0.9
      --jinja
      --context-shift
      --cache-reuse 256
      --metrics
      --no-webui
    aliases:
      - qwen3.8-efficientthink-agent
      - qwen-efficientthink-agent
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  qwen-fast:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/qwen38-worker/Qwen3.8-27B-Q4_0.gguf
      -md /srv/ai/models/qwen38-worker/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -dev Vulkan0
      -devd Vulkan0
      -ngl 999
      -ngld 999
      --fit off
      --flash-attn on
      --ctx-size 230400
      --parallel 1
      --batch-size 2048
      --ubatch-size 256
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q4_0
      --spec-draft-type-v q4_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.2
      --top-p 0.9
      --jinja
      --context-shift
      --cache-reuse 256
      --metrics
      --no-webui
    aliases:
      - qwen3.8-fast
      - qwen-stable
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  qwen-contextstill-64k:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/qwen38-worker/Qwen3.8-27B-Q4_0.gguf
      -md /srv/ai/models/qwen38-worker/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      -dev Vulkan0
      -devd Vulkan0
      -ngl 999
      -ngld 999
      --fit off
      --flash-attn on
      --ctx-size 65536
      --parallel 1
      --batch-size 2048
      --ubatch-size 256
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q4_0
      --spec-draft-type-v q4_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.2
      --top-p 0.9
      --jinja
      --context-shift
      --cache-reuse 256
      --metrics
      --no-webui
    aliases:
      - qwen3.8-contextstill-64k
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  qwen35-decision:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/qwen35-decision/Qwen3.5-2B-Q4_K_M.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 4096
      --parallel 1
      --batch-size 512
      --ubatch-size 512
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning off
      --temp 0
      --top-p 1
      --jinja
      --metrics
      --no-webui
    aliases:
      - qwen3.5-2b-decision
      - decision-default
      - backchannel-qwen35-2b
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  lfm25-backchannel-jp:
    # LARM owns lifecycle through the SAAA Agent Connection. Do not let the
    # proxy's independent idle timer evict this model while that connection is
    # being renewed; LARM still unloads it after release or expiry.
    ttl: 0
    filters:
      setParams:
        temperature: 0
        top_p: 1
        max_tokens: 16
        response_format:
          type: json_schema
          json_schema:
            name: backchannel_decision
            strict: true
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                    - ack
                    - defer
              required:
                - kind
              additionalProperties: false
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/lfm25-1.2b-jp/LFM2.5-1.2B-JP-Q4_K_M.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 65536
      --parallel 1
      --batch-size 512
      --ubatch-size 512
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning off
      --temp 0
      --top-p 1
      --repeat-penalty 1.05
      --jinja
      --metrics
      --no-webui
    aliases:
      - backchannel-lfm25-jp-1.2b
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  gemma3-backchannel:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/gemma3-1b-it/gemma-3-1b-it-Q4_K_M.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 4096
      --parallel 1
      --batch-size 512
      --ubatch-size 512
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning off
      --temp 0
      --top-p 1
      --jinja
      --metrics
      --no-webui
    aliases:
      - backchannel-gemma3-1b
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  gemma4-conversation:
    # The SAAA Agent Connection owns this provider's lifetime. Keep llama-swap
    # from applying an independent idle eviction while SAAA renews the lease;
    # LARM unloads the provider when the connection is released or expires.
    ttl: 0
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/gemma4-e4b-it-gguf/gemma-4-E4B_q4_0-it.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 230400
      --parallel 1
      --batch-size 2048
      --ubatch-size 512
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning off
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --jinja
      --context-shift
      --cache-reuse 256
      --metrics
      --no-webui
    aliases:
      - gemma4-e4b
      - conversation-default
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  ornith15-conversation:
    # Candidate only: this model starts exclusively through the explicit SAAA
    # Agent Connection and remains loaded while that connection is renewed.
    ttl: 0
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/ornith15-35b/Ornith-1.5-35B-Q5_K_M.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 230400
      --parallel 1
      --batch-size 2048
      --ubatch-size 2048
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --no-mmap
      --cont-batching
      --kv-unified
      --host 127.0.0.1
      --port ${PORT}
      --reasoning off
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --jinja
      --context-shift
      --cache-reuse 256
      --metrics
      --no-webui
    aliases:
      - ornith-1.5-35b-conversation
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  qwen36-35b:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/qwen36-35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 262144
      --parallel 1
      --cache-type-k q4_0
      --cache-type-v q4_0
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.2
      --top-p 0.9
      --jinja
      --context-shift
      --cache-reuse 256
      --metrics
      --no-webui
    aliases:
      - qwen3.6-35b
      - qwen-35b
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  ornith15-35b:
    cmd: >
      /srv/ai/apps/llama.cpp/build-vulkan/bin/llama-server
      -m /srv/ai/models/ornith15-35b/Ornith-1.5-35B-Q5_K_M.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 262144
      --parallel 1
      --batch-size 2048
      --ubatch-size 2048
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --no-mmap
      --cont-batching
      --kv-unified
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --jinja
      --context-shift
      --metrics
      --no-webui
    aliases:
      - ornith-1.5-35b
      - ornith-35b
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  ornith15-35b-speed:
    cmd: >
      /srv/ai/apps/q38rocm/engine/bin/llama-server
      -m /srv/ai/models/ornith15-35b/Ornith-1.5-35B-ROCmFP4-STRIX_LEAN.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 262144
      --parallel 1
      --batch-size 2048
      --ubatch-size 2048
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --no-mmap
      --cont-batching
      --kv-unified
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --jinja
      --context-shift
      -ctxcp 0
      -cram 0
      --no-cache-prompt
      --no-cache-idle-slots
      --metrics
      --no-webui
    aliases:
      - ornith-1.5-35b-speed
      - ornith-35b-speed
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

  ornith15-35b-agent:
    cmd: >
      /srv/ai/apps/q38rocm/engine/bin/llama-server
      -m /srv/ai/models/ornith15-35b/Ornith-1.5-35B-ROCmFP4-STRIX_LEAN.gguf
      -dev Vulkan0
      -ngl 999
      --fit off
      --flash-attn on
      --ctx-size 65536
      --parallel 1
      --batch-size 2048
      --ubatch-size 2048
      --threads 16
      --poll 100
      --cache-type-k q8_0
      --cache-type-v q8_0
      --no-mmap
      --cont-batching
      --kv-unified
      --host 127.0.0.1
      --port ${PORT}
      --reasoning auto
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --jinja
      --context-shift
      -ctxcp 0
      -cram 0
      --no-cache-prompt
      --no-cache-idle-slots
      --metrics
      --no-webui
    aliases:
      - ornith-1.5-35b-agent
      - ornith-35b-agent
    env:
      - HIP_VISIBLE_DEVICES=-1
      - ROCR_VISIBLE_DEVICES=-1

groups:
  conversation-llm-slot:
    swap: true
    exclusive: false
    members:
      - gemma4-conversation
      - ornith15-conversation

  qwen-decision-slot:
    swap: false
    exclusive: false
    members:
      - qwen35-decision

  backchannel-llm-slot:
    swap: true
    exclusive: false
    members:
      - lfm25-backchannel-jp
      - gemma3-backchannel

  qwen-worker-slot:
    swap: true
    exclusive: false
    members:
      - qwen-agent
      - qwen-agent-efficientthink
      - qwen-fast
      - qwen-contextstill-64k
      - qwen36-35b
      - ornith15-35b
      - ornith15-35b-speed
      - ornith15-35b-agent
