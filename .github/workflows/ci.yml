name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install music audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run mandatory release checks
        id: release
        run: bun run check:release > "$RUNNER_TEMP/release-gate.json"
      - name: Upload release verification evidence
        if: ${{ always() && steps.release.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            ${{ runner.temp }}/release-gate.json
            coverage/lcov.info
          if-no-files-found: warn
