runtimes:
  qwen-general:
    capability:
      - llm.general
      - llm.reasoning
    protocol: openai.chat-completions.v1
    backend: llama-swap
    node: ai395-01
    policy:
      class: resident
    resources:
      estimatedMemoryGB: 24
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      modelId: qwen-general
      listen: http://127.0.0.1:9292
      endpoint: http://127.0.0.1:9292
      backendEndpoint: http://127.0.0.1:9292/upstream/qwen-general
  qwen-worker:
    capability:
      - llm.general
    protocol: openai.chat-completions.v1
    backend: llama-swap
    node: ai395-01
    policy:
      class: preferred
    resources:
      estimatedMemoryGB: 24
      maxConcurrentRequests: 1
      maxQueuedRequests: 0
      queueTimeoutMs: 1000
    deployment:
      modelId: qwen-worker
      listen: http://127.0.0.1:9292
      endpoint: http://127.0.0.1:9292
      backendEndpoint: http://127.0.0.1:9292/upstream/qwen-worker
